[package]
name = "launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "0.6"
uuid = { version = "1.0", features = ["v3", "v4", "v5"] }
dirs = "5.0"
tauri = { version = "2.0", features = [] }